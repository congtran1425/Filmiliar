name: filmiliar

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: filmiliar
      POSTGRES_USER: filmiliar
      POSTGRES_PASSWORD: ${FILMILIAR_DB_PASSWORD:?Set FILMILIAR_DB_PASSWORD in the private VPS env file}
    volumes:
      - filmiliar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmiliar -d filmiliar"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://filmiliar:${FILMILIAR_DB_PASSWORD}@db:5432/filmiliar?schema=public
      JWT_SECRET: ${FILMILIAR_JWT_SECRET:?Set FILMILIAR_JWT_SECRET in the private VPS env file}
      CORS_ORIGIN: ${FILMILIAR_CORS_ORIGIN:-http://localhost:5173,https://filmiliar.congtc145.id.vn}
      STORAGE_MODE: ${FILMILIAR_STORAGE_MODE:-http_api}
      ENABLE_UPLOADS: ${FILMILIAR_ENABLE_UPLOADS:-false}
      DEMO_CATALOG: ${FILMILIAR_DEMO_CATALOG:-true}
      PAYMENT_MODE: ${FILMILIAR_PAYMENT_MODE:-sandbox}
      ZALOPAY_APP_ID: ${FILMILIAR_ZALOPAY_APP_ID:-2553}
      ZALOPAY_KEY1: ${FILMILIAR_ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${FILMILIAR_ZALOPAY_KEY2:-}
      ZALOPAY_ENDPOINT: ${FILMILIAR_ZALOPAY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_QUERY_ENDPOINT: ${FILMILIAR_ZALOPAY_QUERY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/query}
      ZALOPAY_CALLBACK_URL: ${FILMILIAR_ZALOPAY_CALLBACK_URL:-https://api-filmiliar.congtc145.id.vn/api/payment/callback}
      MEDIA_PUBLIC_URL: ${FILMILIAR_MEDIA_PUBLIC_URL:-https://media.congtc145.id.vn}
      INET_UPLOAD_ENDPOINT: ${FILMILIAR_INET_UPLOAD_ENDPOINT:-https://media.congtc145.id.vn/api_upload.php}
      INET_UPLOAD_SECRET_KEY: ${FILMILIAR_INET_UPLOAD_SECRET_KEY:-}
    ports:
      - "127.0.0.1:3081:5000"
    volumes:
      - filmiliar_uploads:/app/uploads
    mem_limit: 768m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  filmiliar_db:
  filmiliar_uploads:
